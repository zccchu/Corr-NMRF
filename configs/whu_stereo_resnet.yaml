# WHU_stereo (RSMT flat layout): train for training, test for val/test.
# Root layout: <WHU_ROOT>/train/{left_right,disparity}, <WHU_ROOT>/test/{left_right,disparity}
# inaccurate_train is NOT used.

SOLVER:
  IMS_PER_BATCH: 4
  MAX_ITER: 48000
  BASE_LR: 0.001
  BASE_LR_END: 0.0
  MIN_DISP: 0
  MAX_DISP: 128
  CHECKPOINT_PERIOD: 10000
  LOSS_WEIGHTS: [1.4, 1.6, 1.6, 1.8, 2.0]

DPN:
  MIN_DISP: 0
  MAX_DISP: 128

DATASETS:
  TRAIN: ("whu_stereo",)
  TEST: ("whu_stereo_test",)
  WHU_ROOT: datasets/WHU_stereo
  CROP_SIZE: [1024, 896]

NMP:
  NMP_TYPE: "corr_nmrf"
  REFINE_NMP_TYPE: "corr_nmrf"
  TTT_RANK: 8
  TTT_BASE_LR: 1.0
  TTT_MINI_BATCH_SIZE: 16
  TTT_MAX_CHUNKS: 1
  TTT_HARD_TOKEN_RATIO: 0.5
  TTT_USE_SPATIAL_FUSION: True
  TTT_FUSION_KERNELS: [1, 3, 5]
  TTT_DROPOUT: 0.0
  TTT_USE_DIAG: True
  TTT_TARGET_MODE: "epipolar"
  TTT_STOP_GRAD_TARGET: True
  TTT_USE_CONFIDENCE_WEIGHT: True
  TTT_USE_RESIDUAL: True
  TTT_EPIPOLAR_TARGET_STYLE: "split_ln"
  TTT_CORR_LAMBDA: 0.5
  TTT_LOSS_TYPE: "smooth_l1"
  TTT_SMOOTH_L1_BETA: 1.0
  TTT_ROUTER_LOSS_WEIGHT_CONF: True

  NUM_PROP_LAYERS: 1
  NUM_INFER_LAYERS: 1
  NUM_REFINE_LAYERS: 4



TEST:
  # ~1220 train pairs / batch 12 ≈ 102 steps per epoch
  EVAL_PERIOD: 306
  EVAL_MIN_DISP: [0]
  EVAL_MAX_DISP: [128]
